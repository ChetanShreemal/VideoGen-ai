openapi: 3.1.0
info:
  title: VideoGen API
  version: 0.1.0
  description: >-
    Authenticated, owner-scoped project creation, listing, details, updates, archive, and restore.
    Authentication is provided by the Better Auth session cookie.
servers:
  - url: http://127.0.0.1:4000/api/v1
    description: Local development API
tags:
  - name: Projects
    description: Owner-scoped project creation, reading, updating, and lifecycle management
paths:
  /projects:
    post:
      operationId: createProject
      tags: [Projects]
      summary: Create a project
      description: >-
        Creates an active project in the authenticated user's personal workspace.
        The server derives ownership from the session; workspace and creator IDs
        are not accepted from the client. This operation does not start paid work.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
            example:
              title: Rain Cycle
              topic: How does rain form?
              settings:
                durationSeconds: 30
                language: en
                visualStyle: 3d-cartoon
                aspectRatio: 9:16
                voiceId: configured-voice-id
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProjectResponse'
        '400':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/ProjectsUnavailable'
    get:
      operationId: listProjects
      tags: [Projects]
      summary: List active or archived projects
      description: >-
        Returns projects owned by the authenticated user's personal workspace,
        ordered by updatedAt descending with a stable ID tie-breaker.
      security:
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size; defaults to 20 and is capped at 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: Opaque HMAC-signed cursor returned by the previous page and bound to the current user's workspace.
          schema:
            type: string
            minLength: 1
        - name: status
          in: query
          required: false
          description: Select active or archived projects; defaults to active.
          schema:
            type: string
            enum: [active, archived]
            default: active
      responses:
        '200':
          description: Project page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProjectsResponse'
        '400':
          description: Query validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/ProjectsUnavailable'
  /projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getProject
      tags: [Projects]
      summary: Get a project
      description: Returns a project only when it belongs to the authenticated user's personal workspace.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Project details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          description: Project ID is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '503':
          $ref: '#/components/responses/ProjectsUnavailable'
    patch:
      operationId: updateProject
      tags: [Projects]
      summary: Update an active project
      description: >-
        Updates the supplied project fields only when expectedRevision matches the current project revision;
        an explicit null topic clears the topic. A successful update increments the revision.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: Updated project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          description: Project ID or changes are invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '409':
          description: The project revision has changed since it was read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                error:
                  code: STALE_REVISION
                  message: This project changed since you opened it. Reload and try again.
        '503':
          $ref: '#/components/responses/ProjectsUnavailable'
  /projects/{projectId}/archive:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: archiveProject
      tags: [Projects]
      summary: Archive a project (safe to retry)
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Archived project; repeating this request returns the same archived state without another revision change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          description: Project ID is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '503':
          $ref: '#/components/responses/ProjectsUnavailable'
  /projects/{projectId}/restore:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: restoreProject
      tags: [Projects]
      summary: Restore an archived project
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Restored project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          description: Project ID is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '503':
          $ref: '#/components/responses/ProjectsUnavailable'
components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      description: 24-character MongoDB ObjectId.
      schema:
        type: string
        pattern: '^[a-fA-F0-9]{24}$'
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: >-
        Better Auth session cookie. Secure deployments may add the standard
        __Secure- prefix; the API accepts the cookie issued by the auth endpoints.
  responses:
    Unauthenticated:
      description: A valid authenticated session is required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            error:
              code: UNAUTHENTICATED
              message: A valid session is required.
    ProjectsUnavailable:
      description: Authentication or project storage is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            error:
              code: PROJECTS_UNAVAILABLE
              message: Projects are temporarily unavailable.
    ProjectNotFound:
      description: Project was not found in the authenticated user's workspace or is not in the requested state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            error:
              code: PROJECT_NOT_FOUND
              message: Project was not found.
  schemas:
    ProjectSettings:
      type: object
      additionalProperties: false
      description: >-
        Optional project settings. Allowed values for language, visual style,
        aspect ratio and voice remain open pending PRD decision reconciliation.
      properties:
        durationSeconds:
          type: integer
          minimum: 1
        language:
          type: string
          minLength: 2
          maxLength: 35
        visualStyle:
          type: string
          minLength: 1
          maxLength: 80
        aspectRatio:
          type: string
          minLength: 1
          maxLength: 16
        voiceId:
          type: string
          minLength: 1
          maxLength: 128
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
          description: Leading and trailing whitespace is trimmed before validation.
        topic:
          type: string
          maxLength: 2000
        settings:
          $ref: '#/components/schemas/ProjectSettings'
    UpdateProjectRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision]
      properties:
        expectedRevision:
          type: integer
          minimum: 1
          description: Revision returned by the last read; the update is applied only if it still matches.
        title:
          type: string
          minLength: 1
          maxLength: 120
        topic:
          type: [string, 'null']
          maxLength: 2000
        settings:
          $ref: '#/components/schemas/ProjectSettings'
    Project:
      type: object
      additionalProperties: false
      required: [id, title, settings, status, revision, createdAt, updatedAt]
      properties:
        id:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
          maxLength: 120
        topic:
          type: string
          maxLength: 2000
        settings:
          $ref: '#/components/schemas/ProjectSettings'
        status:
          type: string
          enum: [active, archived]
        revision:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateProjectResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [project]
          properties:
            project:
              $ref: '#/components/schemas/Project'
    ProjectResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [project]
          properties:
            project:
              $ref: '#/components/schemas/Project'
    ListProjectsResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [items, nextCursor]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Project'
            nextCursor:
              type: [string, 'null']
              minLength: 1
    ApiErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
