openapi: 3.1.0
info:
  title: VideoGen API
  version: 0.1.0
  description: >-
    Authenticated, owner-scoped project creation, listing, details, updates, archive, and restore.
    Authentication is provided by the Better Auth session cookie.
servers:
  - url: http://127.0.0.1:4000/api/v1
    description: Local development API
tags:
  - name: Projects
    description: Owner-scoped project creation, reading, updating, and lifecycle management
  - name: Generation
    description: Asynchronous generation jobs and status polling
  - name: Voice
    description: Authenticated storyboard narration previews
  - name: Instagram
    description: OAuth connection for an Instagram professional account
paths:
  /projects:
    post:
      operationId: createProject
      tags: [Projects]
      summary: Create a project
      description: >-
        Creates an active project in the authenticated user's personal workspace.
        The server derives ownership from the session; workspace and creator IDs
        are not accepted from the client. This operation does not start paid work.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
            example:
              title: Rain Cycle
              topic: How does rain form?
              settings:
                durationSeconds: 30
                language: en
                visualStyle: 3d-cartoon
                aspectRatio: 9:16
                voiceId: configured-voice-id
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProjectResponse'
        '400':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/ProjectsUnavailable'
    get:
      operationId: listProjects
      tags: [Projects]
      summary: List active or archived projects
      description: >-
        Returns projects owned by the authenticated user's personal workspace,
        ordered by updatedAt descending with a stable ID tie-breaker.
      security:
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size; defaults to 20 and is capped at 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: Opaque HMAC-signed cursor returned by the previous page and bound to the current user's workspace.
          schema:
            type: string
            minLength: 1
        - name: status
          in: query
          required: false
          description: Select active or archived projects; defaults to active.
          schema:
            type: string
            enum: [active, archived]
            default: active
      responses:
        '200':
          description: Project page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProjectsResponse'
        '400':
          description: Query validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/ProjectsUnavailable'
  /projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getProject
      tags: [Projects]
      summary: Get a project
      description: Returns a project only when it belongs to the authenticated user's personal workspace.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Project details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          description: Project ID is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '503':
          $ref: '#/components/responses/ProjectsUnavailable'
    patch:
      operationId: updateProject
      tags: [Projects]
      summary: Update an active project
      description: >-
        Updates the supplied project fields only when expectedRevision matches the current project revision;
        an explicit null topic clears the topic. A successful update increments the revision.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: Updated project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          description: Project ID or changes are invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '409':
          description: The project revision has changed since it was read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                error:
                  code: STALE_REVISION
                  message: This project changed since you opened it. Reload and try again.
        '503':
          $ref: '#/components/responses/ProjectsUnavailable'
  /projects/{projectId}/archive:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: archiveProject
      tags: [Projects]
      summary: Archive a project (safe to retry)
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Archived project; repeating this request returns the same archived state without another revision change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          description: Project ID is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '503':
          $ref: '#/components/responses/ProjectsUnavailable'
  /projects/{projectId}/restore:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: restoreProject
      tags: [Projects]
      summary: Restore an archived project
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Restored project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          description: Project ID is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '503':
          $ref: '#/components/responses/ProjectsUnavailable'
  /projects/{projectId}/assets:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: listProjectAssets
      tags: [Projects]
      summary: List verified reference assets
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Verified assets owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectAssetsResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
  /projects/{projectId}/assets/upload-intents:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: createProjectAssetUploadIntent
      tags: [Projects]
      summary: Create a short-lived private R2 upload URL
      description: The project owner uploads directly to the private R2 bucket, then calls the completion endpoint for byte and media verification.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetUploadRequest'
      responses:
        '201':
          description: Upload intent created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetUploadIntentResponse'
        '400':
          description: Invalid media metadata or rights confirmation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '413':
          description: Project or user storage quota exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '503':
          $ref: '#/components/responses/ProjectsUnavailable'
  /projects/{projectId}/assets/{assetId}/complete:
    post:
      operationId: completeProjectAssetUpload
      tags: [Projects]
      summary: Verify an uploaded object and mark the asset ready
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/AssetId'
      responses:
        '200':
          description: Verified asset metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetCompletionResponse'
        '400':
          description: Uploaded bytes or media metadata are invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '503':
          $ref: '#/components/responses/ProjectsUnavailable'
  /projects/{projectId}/assets/{assetId}/preview:
    get:
      operationId: getProjectAssetPreviewUrl
      tags: [Projects]
      summary: Create a short-lived private preview URL
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/AssetId'
      responses:
        '200':
          description: Expiring object URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetPreviewResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: Verified asset was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '503':
          $ref: '#/components/responses/ProjectsUnavailable'
  /projects/{projectId}/assets/{assetId}:
    delete:
      operationId: deleteProjectAsset
      tags: [Projects]
      summary: Delete a reference asset with retryable cleanup
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/AssetId'
      responses:
        '204':
          description: Asset removed or already absent
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          description: Object cleanup remains pending and can be retried
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /projects/{projectId}/storyboards:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: listProjectStoryboards
      tags: [Projects]
      summary: List storyboard versions for a project
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Storyboard versions, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryboardListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
    post:
      operationId: createProjectStoryboard
      tags: [Projects]
      summary: Save a new storyboard draft version
      description: Creates a manually-authored draft; this endpoint does not invoke an AI provider or start paid work.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveStoryboardRequest'
      responses:
        '201':
          description: New storyboard draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryboardResponse'
        '400':
          description: Storyboard content is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
  /projects/{projectId}/storyboards/{storyboardId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: storyboardId
        in: path
        required: true
        schema:
          type: string
          pattern: '^[a-fA-F0-9]{24}$'
    patch:
      operationId: updateProjectStoryboardDraft
      tags: [Projects]
      summary: Update a draft storyboard at its expected revision
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveStoryboardRequest'
      responses:
        '200':
          description: Updated draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryboardResponse'
        '409':
          description: Storyboard revision is stale or the storyboard is approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: Project or storyboard was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /projects/{projectId}/storyboards/{storyboardId}/narration-audio:
    post:
      operationId: generateStoryboardNarrationAudio
      tags: [Voice]
      summary: Generate a temporary narration preview for a saved storyboard
      description: >-
        Sends the saved storyboard narration to Gemini 3.8 Flash-Lite TTS and returns a WAV preview.
        Requires the server-side GEMINI_API_KEY. Google may use free-tier inputs and outputs to improve
        its products. No audio file is persisted by this endpoint. Per user, only one request may be
        active at a time and at most 10 accepted requests are allowed in any rolling 60-minute window.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: storyboardId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-fA-F0-9]{24}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [voiceName]
              properties:
                voiceName:
                  type: string
                  enum: [Kore, Puck, Charon, Aoede, Fenrir, Zephyr]
      responses:
        '200':
          description: Generated WAV audio for immediate preview; not stored
          content:
            audio/wav:
              schema:
                type: string
                format: binary
        '400':
          description: Voice, IDs, or saved storyboard narration are invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: Project or storyboard was not found for this account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Project is archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          description: A voice preview is already running, the user reached the rolling hourly limit, or Gemini's quota was exceeded. Retry-After is returned for application-enforced limits.
          headers:
            Retry-After:
              description: Seconds to wait before retrying an application-enforced concurrency or usage limit
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '502':
          description: Gemini generation or audio response failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '503':
          description: Voice provider or API unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '504':
          description: Voice generation timed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /projects/{projectId}/narration-assets:
    get:
      operationId: listSavedNarrationAssets
      tags: [Voice]
      summary: List privately saved narration for an owned project
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Saved narration metadata, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectNarrationAssetsResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: Owned project was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '503':
          $ref: '#/components/responses/ProjectsUnavailable'
  /projects/{projectId}/storyboards/{storyboardId}/narration-assets:
    post:
      operationId: saveStoryboardNarrationAsset
      tags: [Voice]
      summary: Explicitly save a generated WAV preview to private R2 storage
      description: >-
        Saves only when the user explicitly requests it. Requires an active owned project and an
        owned saved storyboard. WAV files are limited to 25 MiB, 20 assets per project and 1 GiB
        per user. Saved audio remains private until the user deletes it; pending and failed deletes
        are retried by the cleanup worker.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: storyboardId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-fA-F0-9]{24}$'
        - name: voiceName
          in: query
          required: true
          schema:
            type: string
            enum: [Kore, Puck, Charon, Aoede, Fenrir, Zephyr]
      requestBody:
        required: true
        content:
          audio/wav:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Audio stored privately and its metadata returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NarrationAssetResponse'
        '400':
          description: Invalid WAV data, IDs or voice name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: Active owned project or saved storyboard was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '413':
          description: File or project/account saved narration quota exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '503':
          description: Private object storage or database is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /projects/{projectId}/narration-assets/{assetId}/preview:
    get:
      operationId: getSavedNarrationPreviewUrl
      tags: [Voice]
      summary: Create a short-lived private URL for a saved narration file
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/AssetId'
      responses:
        '200':
          description: Expiring private audio URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetPreviewResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: Owned saved narration was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '503':
          $ref: '#/components/responses/ProjectsUnavailable'
  /projects/{projectId}/narration-assets/{assetId}:
    delete:
      operationId: deleteSavedNarrationAsset
      tags: [Voice]
      summary: Delete a saved narration file with retryable private-object cleanup
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/AssetId'
      responses:
        '204':
          description: Narration removed or already absent
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          description: Object cleanup remains queued and will retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /projects/{projectId}/storyboards/{storyboardId}/approve:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: storyboardId
        in: path
        required: true
        schema:
          type: string
          pattern: '^[a-fA-F0-9]{24}$'
    post:
      operationId: approveProjectStoryboard
      tags: [Projects]
      summary: Approve and lock a draft storyboard
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision]
              properties:
                expectedRevision:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Approved storyboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryboardResponse'
        '409':
          description: Storyboard revision is stale or already approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: Project or storyboard was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /projects/{projectId}/generations:
    post:
      operationId: createGenerationJob
      tags: [Generation]
      summary: Start generation from an approved storyboard
      description: >-
        Creates or reuses an idempotent asynchronous generation job. The current
        development provider only simulates progress and does not create a video.
        Production requests return 503 until a real provider is configured.
      security:
        - sessionCookie: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-fA-F0-9]{24}$'
        - name: Idempotency-Key
          in: header
          required: true
          description: Visible ASCII key, 1–128 characters. Reusing it with a different request returns 409.
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGenerationJobRequest'
      responses:
        '202':
          description: Job accepted or existing idempotent job reused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateGenerationJobResponse'
        '400':
          description: Invalid project, storyboard, or idempotency key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: Project or approved storyboard was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Project is archived, storyboard is not approved, or idempotency key conflicts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '503':
          description: Generation provider is unavailable or not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /jobs/{jobId}:
    get:
      operationId: getGenerationJob
      tags: [Generation]
      summary: Get generation job status
      description: Returns job progress only to its owner. Poll this endpoint using the statusUrl returned when the job was created.
      security:
        - sessionCookie: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-fA-F0-9]{24}$'
      responses:
        '200':
          description: Current job state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationJobResponse'
        '400':
          description: Invalid job ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: Job was not found for this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '503':
          description: Job status is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /projects/{projectId}/instagram-posts:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: listInstagramPostDrafts
      tags: [Instagram]
      summary: List reviewed-post drafts for a project
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Drafts with approval state; no tokens are returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstagramPostDraftsResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { description: Project was not found }
    post:
      operationId: createInstagramPostDraft
      tags: [Instagram]
      summary: Create a post draft from a saved project export
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [exportId]
              properties:
                exportId: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
                caption: { type: string, maxLength: 2200, default: '' }
      responses:
        '201':
          description: Draft saved; it is not published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstagramPostDraftResponse' }
        '400': { description: Invalid draft details }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { description: Project or saved export was not found }
  /projects/{projectId}/instagram-posts/{postId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: postId
        in: path
        required: true
        schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
    patch:
      operationId: updateInstagramPostDraft
      tags: [Instagram]
      summary: Update a draft and clear any previous approval
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision, exportId, caption]
              properties:
                expectedRevision: { type: integer, minimum: 1 }
                exportId: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
                caption: { type: string, maxLength: 2200 }
      responses:
        '200':
          description: Updated draft; any prior approval is invalidated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstagramPostDraftResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { description: Revision conflict }
  /projects/{projectId}/instagram-posts/{postId}/approve:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: postId
        in: path
        required: true
        schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
    post:
      operationId: approveInstagramPostDraft
      tags: [Instagram]
      summary: Approve the exact saved video and caption for a future publishing step
      description: Approval never publishes content. Editing the draft clears its approval.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Approved snapshot recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstagramPostDraftResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { description: Instagram account is not connected or selected export is unavailable }
  /instagram/account:
    get:
      operationId: getInstagramAccount
      tags: [Instagram]
      summary: Get the connected Instagram account
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Configuration and account status; no access token is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstagramAccountResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          description: Instagram account status is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
    delete:
      operationId: disconnectInstagramAccount
      tags: [Instagram]
      summary: Remove the saved Instagram connection
      description: Deletes the encrypted account token from VideoGen; the user can separately revoke the app grant in Instagram.
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Saved connection removed
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          description: Connection could not be removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /instagram/oauth/start:
    post:
      operationId: startInstagramOAuth
      tags: [Instagram]
      summary: Create an Instagram authorization URL
      description: Creates a one-use, expiring OAuth state bound to the signed-in user's workspace.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Authorization URL for Instagram Login
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [authorizationUrl]
                    properties:
                      authorizationUrl:
                        type: string
                        format: uri
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          description: Instagram integration is not configured or temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /instagram/oauth/callback:
    get:
      operationId: instagramOAuthCallback
      tags: [Instagram]
      summary: Complete the one-time Instagram authorization flow
      description: Instagram redirects here with a short-lived code and opaque state. Tokens are exchanged server-side and the browser is redirected to the trusted app origin.
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the Instagram connection page with a generic outcome
components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      description: 24-character MongoDB ObjectId.
      schema:
        type: string
        pattern: '^[a-fA-F0-9]{24}$'
    AssetId:
      name: assetId
      in: path
      required: true
      description: 24-character MongoDB ObjectId.
      schema:
        type: string
        pattern: '^[a-fA-F0-9]{24}$'
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: >-
        Better Auth session cookie. Secure deployments may add the standard
        __Secure- prefix; the API accepts the cookie issued by the auth endpoints.
  responses:
    Unauthenticated:
      description: A valid authenticated session is required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            error:
              code: UNAUTHENTICATED
              message: A valid session is required.
    ProjectsUnavailable:
      description: Authentication or project storage is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            error:
              code: PROJECTS_UNAVAILABLE
              message: Projects are temporarily unavailable.
    ProjectNotFound:
      description: Project was not found in the authenticated user's workspace or is not in the requested state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            error:
              code: PROJECT_NOT_FOUND
              message: Project was not found.
  schemas:
    CreateGenerationJobRequest:
      type: object
      additionalProperties: false
      required: [storyboardId]
      properties:
        storyboardId:
          type: string
          pattern: '^[a-fA-F0-9]{24}$'
    CreateGenerationJobResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [jobId, status, statusUrl, simulated]
          properties:
            jobId: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
            status: { $ref: '#/components/schemas/GenerationJobStatus' }
            statusUrl: { type: string }
            simulated: { type: boolean, const: true }
    GenerationJobStatus:
      type: string
      enum: [queued, running, completed, failed]
    GenerationJobResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [job]
          properties:
            job: { $ref: '#/components/schemas/GenerationJob' }
    GenerationJob:
      type: object
      additionalProperties: false
      required: [id, projectId, storyboardId, storyboardVersion, provider, simulated, status, stage, progressPercent, scenes, videoAssetId, createdAt, updatedAt]
      properties:
        id: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
        projectId: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
        storyboardId: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
        storyboardVersion: { type: integer, minimum: 1 }
        provider: { type: string, const: mock }
        simulated: { type: boolean, const: true }
        status: { $ref: '#/components/schemas/GenerationJobStatus' }
        stage: { type: string, enum: [queued, preparing, processing_scenes, assembling, completed, failed] }
        progressPercent: { type: integer, minimum: 0, maximum: 100 }
        scenes:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [sceneId, title, status, progressPercent]
            properties:
              sceneId: { type: string, minLength: 1, maxLength: 80 }
              title: { type: string, minLength: 1, maxLength: 120 }
              status: { type: string, enum: [queued, running, completed, failed] }
              progressPercent: { type: integer, minimum: 0, maximum: 100 }
        videoAssetId: { type: 'null' }
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string, minLength: 1 }
            message: { type: string, minLength: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
    AssetUploadRequest:
      type: object
      additionalProperties: false
      required: [fileName, contentType, sizeBytes, rightsConfirmed]
      properties:
        fileName:
          type: string
          minLength: 1
          maxLength: 255
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp, video/mp4, video/quicktime]
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 104857600
        rightsConfirmed:
          type: boolean
          const: true
    AssetUploadIntentResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [assetId, uploadUrl, expiresAt]
          properties:
            assetId:
              type: string
            uploadUrl:
              type: string
              format: uri
            expiresAt:
              type: string
              format: date-time
    ProjectAssetsResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ProjectAsset'
    ProjectAsset:
      type: object
      required: [id, fileName, contentType, sizeBytes, media, createdAt]
      properties:
        id:
          type: string
        fileName:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: integer
        media:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
    AssetCompletionResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [asset]
          properties:
            asset:
              $ref: '#/components/schemas/ProjectAsset'
    AssetPreviewResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [url, expiresAt]
          properties:
            url:
              type: string
              format: uri
            expiresAt:
              type: string
              format: date-time
    ProjectNarrationAssetsResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ProjectNarrationAsset'
    ProjectNarrationAsset:
      type: object
      required: [id, storyboardId, storyboardVersion, voiceName, sizeBytes, createdAt]
      properties:
        id:
          type: string
          pattern: '^[a-fA-F0-9]{24}$'
        storyboardId:
          type: string
          pattern: '^[a-fA-F0-9]{24}$'
        storyboardVersion:
          type: integer
          minimum: 1
        voiceName:
          type: string
          enum: [Kore, Puck, Charon, Aoede, Fenrir, Zephyr]
        sizeBytes:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
    NarrationAssetResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [asset]
          properties:
            asset:
              $ref: '#/components/schemas/ProjectNarrationAsset'
    ProjectSettings:
      type: object
      additionalProperties: false
      description: >-
        Optional project settings. Allowed values for language, visual style,
        aspect ratio, duration and voice remain open pending PRD decision reconciliation.
      properties:
        genre:
          type: string
          enum: [cartoon, educational]
        durationSeconds:
          type: integer
          minimum: 1
        language:
          type: string
          minLength: 2
          maxLength: 35
        visualStyle:
          type: string
          minLength: 1
          maxLength: 80
        aspectRatio:
          type: string
          minLength: 1
          maxLength: 16
        voiceId:
          type: string
          minLength: 1
          maxLength: 128
        audioMix:
          type: object
          additionalProperties: false
          description: Stored mix preferences only; provider-backed playback/generation is not connected yet.
          required: [narrationVolume, musicVolume, musicEnabled]
          properties:
            narrationVolume:
              type: number
              minimum: 0
              maximum: 1
            musicVolume:
              type: number
              minimum: 0
              maximum: 1
            musicEnabled:
              type: boolean
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
          description: Leading and trailing whitespace is trimmed before validation.
        topic:
          type: string
          maxLength: 2000
        settings:
          $ref: '#/components/schemas/ProjectSettings'
    UpdateProjectRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision]
      properties:
        expectedRevision:
          type: integer
          minimum: 1
          description: Revision returned by the last read; the update is applied only if it still matches.
        title:
          type: string
          minLength: 1
          maxLength: 120
        topic:
          type: [string, 'null']
          maxLength: 2000
        settings:
          $ref: '#/components/schemas/ProjectSettings'
    StoryboardScene:
      type: object
      additionalProperties: false
      required: [id, title, narration, visualDescription, caption, durationSeconds, transition, characterReferences]
      properties:
        id: { type: string, minLength: 1, maxLength: 80 }
        title: { type: string, minLength: 1, maxLength: 120 }
        narration: { type: string, maxLength: 4000 }
        visualDescription: { type: string, maxLength: 2000 }
        caption: { type: string, maxLength: 500 }
        durationSeconds: { type: integer, minimum: 1, maximum: 600 }
        transition: { type: string, maxLength: 80 }
        characterReferences:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 120 }
    StoryboardContent:
      type: object
      additionalProperties: false
      required: [hook, closing, scenes]
      properties:
        hook: { type: string, maxLength: 2000 }
        closing: { type: string, maxLength: 2000 }
        scenes:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/StoryboardScene' }
    SaveStoryboardRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        expectedRevision:
          type: integer
          minimum: 1
          description: Required for PATCH; omitted when creating a new version.
        content:
          $ref: '#/components/schemas/StoryboardContent'
    Storyboard:
      type: object
      additionalProperties: false
      required: [id, projectId, version, status, revision, content, createdAt, updatedAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        version: { type: integer, minimum: 1 }
        status: { type: string, enum: [draft, approved] }
        revision: { type: integer, minimum: 1 }
        content: { $ref: '#/components/schemas/StoryboardContent' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    StoryboardResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [storyboard]
          properties:
            storyboard: { $ref: '#/components/schemas/Storyboard' }
    StoryboardListResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Storyboard' }
    Project:
      type: object
      additionalProperties: false
      required: [id, title, settings, status, revision, createdAt, updatedAt]
      properties:
        id:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
          maxLength: 120
        topic:
          type: string
          maxLength: 2000
        settings:
          $ref: '#/components/schemas/ProjectSettings'
        status:
          type: string
          enum: [active, archived]
        revision:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateProjectResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [project]
          properties:
            project:
              $ref: '#/components/schemas/Project'
    ProjectResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [project]
          properties:
            project:
              $ref: '#/components/schemas/Project'
    ListProjectsResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [items, nextCursor]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Project'
            nextCursor:
              type: [string, 'null']
              minLength: 1
    InstagramAccountResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [configured, account]
          properties:
            configured: { type: boolean }
            account:
              oneOf:
                - type: 'null'
                - type: object
                  additionalProperties: false
                  required: [username, connectedAt, expiresAt, scopes]
                  properties:
                    username: { type: string, minLength: 1, maxLength: 80 }
                    accountType: { type: string, enum: [Business, Media_Creator] }
                    connectedAt: { type: string, format: date-time }
                    expiresAt: { type: string, format: date-time }
                    scopes:
                      type: array
                      maxItems: 20
                      items: { type: string, minLength: 1 }
    InstagramPostDraft:
      type: object
      additionalProperties: false
      required: [id, projectId, exportId, fileName, caption, status, revision, approvedAt, updatedAt]
      properties:
        id: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
        projectId: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
        exportId: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
        fileName: { type: string, minLength: 1, maxLength: 255 }
        caption: { type: string, maxLength: 2200 }
        status: { type: string, enum: [draft, approved] }
        revision: { type: integer, minimum: 1 }
        approvedAt: { type: [string, 'null'], format: date-time }
        updatedAt: { type: string, format: date-time }
    InstagramPostDraftResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [item]
          properties:
            item: { $ref: '#/components/schemas/InstagramPostDraft' }
    InstagramPostDraftsResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/InstagramPostDraft' }
    ApiErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
